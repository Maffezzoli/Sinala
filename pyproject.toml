[project]
name = "sinala"
version = "0.1.0"
description = "MVP local de reconhecimento de sinais da Libras por landmarks das mãos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "mediapipe>=0.10,<1",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<5",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "tenacity>=8.2,<10",
    "torch>=2.4,<3",
]

[project.scripts]
sinala = "sinala.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinala"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev"]
